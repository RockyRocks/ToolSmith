name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Linux (GCC)
  # ---------------------------------------------------------------------------
  build-linux-gcc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DUSE_UWS=OFF -DBUILD_CSHARP=OFF -DTEST_FRAMEWORK=GTest

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # Linux (Clang)
  # ---------------------------------------------------------------------------
  build-linux-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Clang
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 4))
          done

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DUSE_UWS=OFF -DBUILD_CSHARP=OFF -DTEST_FRAMEWORK=GTest

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # Windows (MSVC)
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DUSE_UWS=OFF -DBUILD_CSHARP=OFF -DTEST_FRAMEWORK=GTest

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # macOS (Apple Clang)
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DUSE_UWS=OFF -DBUILD_CSHARP=OFF -DTEST_FRAMEWORK=GTest

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # C# Wrapper (Linux + .NET 8)
  # ---------------------------------------------------------------------------
  build-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DUSE_UWS=OFF -DBUILD_CSHARP=ON -DTEST_FRAMEWORK=GTest

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Verify C# output
        run: test -f build/csharp/McpClient.dll
